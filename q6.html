<!DOCTYPE html>
<html>
<body>
<form>
  <label for="fullname">Full Name:</label>
  <input type="text" id="fullname" name="fullname"><br><br>
  <label for="email">Email Address:</label>
  <input type="text" id="email" name="email"><br><br>
  <p>Experience Level:</p>
  <input type="radio" id="beginner" name="experience" value="beginner">
  <label for="beginner">Beginner</label><br>
  <input type="radio" id="intermediate" name="experience" value="intermediate">
  <label for="intermediate">Intermediate</label><br>
  <input type="radio" id="advanced" name="experience" value="advanced">
  <label for="advanced">Advanced</label><br><br>
  <p>Preferred Workshop Tracks:</p>
  <input type="checkbox" id="web" name="track" value="web">
  <label for="web">Web Development</label><br>
  <input type="checkbox" id="data" name="track" value="data">
  <label for="data">Data Science</label><br>
  <input type="checkbox" id="mobile" name="track" value="mobile">
  <label for="mobile">Mobile Apps</label><br><br>
  <label for="questions">Specific questions or accessibility requirements:</label><br>
  <textarea id="questions" name="questions" rows="4" cols="40"></textarea><br><br>
  <input type="submit" value="Submit Registration">
</form>
</body>
</html>
