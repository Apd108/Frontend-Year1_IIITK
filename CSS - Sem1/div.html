<!DOCTYPE html>
<html>
    <body>
        <h1>Multiple Div elements</h1>
        <style>
            div {
            width: fit-content;
            padding: 4px 10px;
            margin-bottom: 15px;
            }
        </style>
        </style>
        <div style="background-color: bisque;">
            <h2>London</h2>
            <p>London is the capital city of England.</p>
            <p>London has over 9 million inhabitants.</p>
        </div>
        <div style="background-color: lightcyan;">
            <h2>Oslo</h2>
            <p>Oslo is the capital city of Norway.</p>
            <p>London has over 700_000 inhabitants.</p>
        </div>
        <div style="background-color: lightblue;">
            <h2>BBSR</h2>
            <p>BBSR is the capital city of Odisha.</p>
            <p>BBSR has over 1.27 million inhabitants.</p>
        </div>
    </body>
</html>
